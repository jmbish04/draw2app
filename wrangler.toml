name = "draw2app"
main = "dist/_worker.js/index.js"
compatibility_date = "2024-07-15"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build:workers"

[dev]
host = "localhost"
port = 8080

[vars]
# Environment variables for your worker
